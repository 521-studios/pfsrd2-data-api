name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  GO_VERSION: "1.24"

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        working-directory: service
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "❌ These files are not formatted:"
            echo "$unformatted"
            echo ""
            echo "Run 'gofmt -w .' in service/ to fix."
            exit 1
          fi

      - name: Vet
        working-directory: service
        run: go vet ./...

      - name: Run tests
        working-directory: service
        run: go test -race ./...

  lint:
    name: Lint (staticcheck, deadcode, gocognit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The current staticcheck and x/tools releases need Go 1.26 to build.
      # Linting a go 1.24 module with them is fine; tests stay on GO_VERSION.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Install linters
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/tools/cmd/deadcode@v0.52.0
          go install github.com/uudashr/gocognit/cmd/gocognit@v1.3.0

      - name: Lint against baseline
        working-directory: service
        run: scripts/lint-baseline.sh
