name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  GO_VERSION: "1.25"

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        working-directory: service
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "❌ These files are not formatted:"
            echo "$unformatted"
            echo ""
            echo "Run 'gofmt -w .' in service/ to fix."
            exit 1
          fi

      - name: Run tests
        working-directory: service
        run: go test ./...
