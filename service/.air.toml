root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/local"
  bin = "./tmp/main"
  full_bin = "./tmp/main"
  include_ext = ["go", "toml"]
  exclude_dir = ["tmp", "vendor"]
  delay = 1000  # ms between rebuild trigger and start

[log]
  time = true

[color]
  main     = "magenta"
  watcher  = "cyan"
  build    = "yellow"
  runner   = "green"

[misc]
  clean_on_exit = true
