openapi: 3.1.0
info:
  title: pfsrd2-data-api
  description: Pathfinder 2e structured data API backed by S3 and SQLite.
  version: 0.1.0

servers:
  - url: http://localhost:8090/api/pfsrd2
    description: Local dev (docker-compose)
  - url: https://api.lets-roll.io/api/pfsrd2
    description: Production (Lambda + CloudFront)

paths:
  /search:
    get:
      operationId: search
      summary: Full-text search across all entry types
      parameters:
        - name: q
          in: query
          description: FTS5 prefix search query
          schema:
            type: string
        - name: type
          in: query
          description: Filter by content type (e.g. monsters, spells)
          schema:
            type: string
        - name: level
          in: query
          description: "Filter by level — single value (\"3\") or range (\"1-5\")"
          schema:
            type: string
        - name: source
          in: query
          description: Filter by source book name
          schema:
            type: string
        - name: edition
          in: query
          description: Filter by edition (legacy or remastered)
          schema:
            type: string
            enum: [legacy, remastered]
        - name: traits
          in: query
          description: Comma-separated trait names to filter by
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"

  /search/suggest:
    get:
      operationId: suggest
      summary: Typeahead suggestions using trigram substring matching
      description: |
        Returns minimal entry data for typeahead UIs.
        Trigram index for substring matching (e.g. "dragon" matches
        "Pseudodragon"). Requires at least 3 characters in `q`.
        Hard cap at 15 results.
      parameters:
        - name: q
          in: query
          required: true
          description: Search string (minimum 3 characters)
          schema:
            type: string
            minLength: 3
        - name: type
          in: query
          description: Content type filter. Repeat for multiple types.
          explode: true
          schema:
            type: array
            items:
              type: string
          example: ["monsters", "npcs"]
        - name: version
          in: query
          description: Only include entries that have this schema version available in S3
          schema:
            type: string
          example: "1.2"
        - name: limit
          in: query
          schema:
            type: integer
            default: 15
            minimum: 0
            maximum: 15
      responses:
        "200":
          description: Suggestion list (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Suggestion"

  /search/suggest/unified:
    get:
      operationId: suggestUnified
      summary: Edition-aware typeahead with cross-edition alternates
      description: |
        Like `/search/suggest` but edition-aware. Each result includes the
        entry's edition and, when available, its cross-edition alternate
        (e.g. Orc Brute ↔ Orc Scrapper). When both editions match the query,
        they are deduplicated into a single result — whichever name matched
        is the primary, and the counterpart rides along as `alternate`.

        No minimum character requirement. 1-2 character queries use direct
        LIKE matching; 3+ characters use the trigram index.
      parameters:
        - name: q
          in: query
          required: true
          description: Search string (any length)
          schema:
            type: string
        - name: type
          in: query
          description: Content type filter. Repeat for multiple types.
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: version
          in: query
          description: Only include entries that have this schema version available
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 15
            maximum: 15
      responses:
        "200":
          description: Suggestion list (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnifiedSuggestion"

  /types:
    get:
      operationId: listTypes
      summary: List all content types with entry counts
      responses:
        "200":
          description: Array of types and their counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TypeCount"

  /sources:
    get:
      operationId: listSources
      summary: List all source books
      responses:
        "200":
          description: Array of source books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Source"

  /entries/{gameID}:
    get:
      operationId: getEntry
      summary: Get entry metadata and all available schema versions
      parameters:
        - name: gameID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Entry with version list
          content:
            application/json:
              schema:
                type: object
                required: [entry, versions]
                properties:
                  entry:
                    $ref: "#/components/schemas/Entry"
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/EntryVersion"
        "404":
          $ref: "#/components/responses/NotFound"

  /entries/{gameID}/full:
    get:
      operationId: getEntryFull
      summary: Get full JSON content for an entry from S3
      parameters:
        - name: gameID
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: query
          description: Schema version to fetch (defaults to current)
          schema:
            type: string
      responses:
        "200":
          description: Raw JSON content from S3
          content:
            application/json:
              schema: {}
        "404":
          $ref: "#/components/responses/NotFound"

  /images/{category}/{filename}:
    get:
      operationId: imageRedirect
      summary: Redirect to CDN URL for an image
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to CloudFront image URL

  /db/status:
    get:
      operationId: dbStatus
      summary: Check local DB freshness against S3
      responses:
        "200":
          description: DB sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DBStatus"

  /db/refresh:
    post:
      operationId: dbRefresh
      summary: Force re-download of the SQLite DB from S3
      responses:
        "200":
          description: Refresh complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: refreshed

  /templates/{monsterGameID}/apply/{templateGameID}:
    get:
      operationId: applyTemplateByID
      summary: Apply a monster template to a creature by game IDs
      description: |
        Looks up both entries in the DB, fetches their JSON from S3, applies
        the template, and returns a multipart/mixed response with two parts:
        1. The patch document (grouped RFC 6902 operations)
        2. The modified creature JSON

        **Edition auto-resolution:** If the creature and template have different
        editions (legacy vs remastered), the API automatically looks up the
        alternate template for the creature's edition via the `alternates` table.
        For example, requesting the remastered Elite (MonsterTemplates:22) for a
        legacy creature will automatically use the legacy Elite (MonsterTemplates:1).
      parameters:
        - name: monsterGameID
          in: path
          required: true
          description: "Game ID of the creature (e.g. Monsters:100)"
          schema:
            type: string
        - name: templateGameID
          in: path
          required: true
          description: "Game ID of the template (e.g. MonsterTemplates:22)"
          schema:
            type: string
        - name: monster_version
          in: query
          description: Schema version for the creature JSON (defaults to current)
          schema:
            type: string
        - name: template_version
          in: query
          description: Schema version for the template JSON (defaults to current)
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/TemplateApplyResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /templates/apply:
    post:
      operationId: applyTemplateInline
      summary: Apply a template to an inline creature
      description: |
        Accepts a creature JSON body and either an inline template or a
        `template_game_id` to look up from S3. Returns a multipart/mixed
        response with the patch document and modified creature as separate parts.

        When using `template_game_id`, edition auto-resolution applies: if the
        creature's `edition` field differs from the template's edition, the API
        looks up the same-edition alternate automatically.

        Supports chaining: submit the creature part from a previous response
        as `creature` with a new template.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateApplyRequest"
      responses:
        "200":
          $ref: "#/components/responses/TemplateApplyResult"
        "400":
          description: Invalid request (missing creature or template)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /{type}:
    get:
      operationId: listByType
      summary: List entries of a specific content type
      parameters:
        - name: type
          in: path
          required: true
          description: Content type (e.g. monsters, spells, feats, equipment)
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
        - name: edition
          in: query
          schema:
            type: string
            enum: [legacy, remastered]
        - name: level
          in: query
          description: "Single value (\"3\") or range (\"1-5\")"
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated entry list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"

  /{type}/{schemaVersion}/{book}/{filename}:
    get:
      operationId: getFullJSON
      summary: Fetch raw JSON from S3 by explicit path
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: schemaVersion
          in: path
          required: true
          schema:
            type: string
        - name: book
          in: path
          required: true
          schema:
            type: string
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Raw JSON content from S3
          content:
            application/json:
              schema: {}
        "404":
          $ref: "#/components/responses/NotFound"

components:
  schemas:
    Entry:
      type: object
      required: [id, game_id, type, name, current_schema_version, base_path, s3_key]
      properties:
        id:
          type: integer
          format: int64
        game_id:
          type: string
        aonid:
          type: integer
          nullable: true
        type:
          type: string
        name:
          type: string
        current_schema_version:
          type: string
        base_path:
          type: string
        s3_key:
          type: string
        level:
          type: integer
          nullable: true
        source:
          type: string
          nullable: true
        source_page:
          type: integer
          nullable: true
        edition:
          type: string
          nullable: true
        image_s3_key:
          type: string
          nullable: true
        attrs:
          description: Type-specific fields as a JSON object
          type: object
        indexed_at:
          type: string

    EntryVersion:
      type: object
      required: [game_id, schema_version, s3_key]
      properties:
        game_id:
          type: string
        schema_version:
          type: string
        s3_key:
          type: string

    SearchResult:
      type: object
      required: [results, total]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
        total:
          type: integer

    TypeCount:
      type: object
      required: [type, count]
      properties:
        type:
          type: string
        count:
          type: integer

    Source:
      type: object
      required: [name]
      properties:
        name:
          type: string
        aonid:
          type: integer
          nullable: true

    Suggestion:
      type: object
      required: [game_id, name, type]
      properties:
        game_id:
          type: string
        name:
          type: string
        type:
          type: string
        level:
          type: integer
          nullable: true
        image_s3_key:
          type: string
          nullable: true

    UnifiedSuggestion:
      type: object
      required: [game_id, name, type]
      description: Edition-aware typeahead result.
      properties:
        game_id:
          type: string
        name:
          type: string
        type:
          type: string
        level:
          type: integer
          nullable: true
        edition:
          type: string
          enum: [legacy, remastered]
          nullable: true
        image_s3_key:
          type: string
          nullable: true
        alternate:
          description: Cross-edition counterpart (omitted when none exists)
          $ref: "#/components/schemas/UnifiedSuggestion"

    DBStatus:
      type: object
      required: [local_etag, s3_etag, up_to_date, last_checked, last_refreshed]
      properties:
        local_etag:
          type: string
        s3_etag:
          type: string
        up_to_date:
          type: boolean
        last_checked:
          type: string
        last_refreshed:
          type: string

    TemplateApplyRequest:
      type: object
      required: [creature]
      properties:
        creature:
          description: Full creature JSON (must include stat_block)
          type: object
        template_game_id:
          description: "Game ID to look up template from S3 (e.g. MonsterTemplates:22)"
          type: string
        template_version:
          description: Schema version for the template (defaults to current)
          type: string
        template:
          description: Inline template JSON (used instead of template_game_id)
          $ref: "#/components/schemas/MonsterTemplate"

    MonsterTemplate:
      type: object
      required: [name, monster_template]
      properties:
        name:
          type: string
          example: Elite
        monster_template:
          type: object
          required: [name, changes]
          properties:
            name:
              type: string
            changes:
              type: array
              items:
                $ref: "#/components/schemas/TemplateChange"

    TemplateChange:
      type: object
      required: [text, change_category, effects]
      properties:
        text:
          description: Human-readable description of the change
          type: string
        change_category:
          description: Category grouping for this change
          type: string
          enum:
            - level
            - combat_stats
            - damage
            - hit_points
            - abilities
            - attributes
            - gear
            - immunities
            - languages
            - resistances
            - senses
            - size
            - skills
            - speed
            - spells
            - strikes
            - traits
            - weaknesses
            - unknown
        effects:
          type: array
          items:
            $ref: "#/components/schemas/TemplateEffect"

    TemplateEffect:
      type: object
      required: [target, operation]
      properties:
        conditional:
          description: |
            When to apply this effect. Supports: "default", path comparisons
            (e.g. "$.creature_type.level <= 0"), && conjunctions, and null
            checks. Effects sharing a target AND operation form a first-match
            chain, except item-accumulating operations (add_item, add_items,
            remove_item, add_modifier), which always all apply; other
            conditional effects evaluate independently.
          type: string
          example: "$.creature_type.level <= 0"
        target:
          description: "JSONPath within stat_block (e.g. $.defense.ac.value). Supports [*] wildcards and [?(@.field=='v')] filters."
          type: string
          example: "$.defense.ac.value"
        operation:
          type: string
          enum:
            - adjustment
            - add_item
            - add_items
            - add_modifier
            - add_strike
            - no_op
            - replace
            - remove_all_except
            - remove_item
            - replace_highest_with
            - replace_one_die
            - select
            - set_reach
            - size_increment
        value:
          description: |
            Operation value. Numeric for adjustment/set_reach; any JSON value
            for replace; damage type string for replace_one_die. set_reach
            also accepts {"baseline": B, "notable": N} — melee attacks without
            a Reach trait gain a copy of `item` at B feet, attacks with one
            are lowered to N feet (never raised).
        value_from:
          description: |
            JSONPath expression computing the value from the creature
            (supports "| max", "| min", "| max / N", "| high_for_level", "/ N").
          type: string
        minimum:
          description: Floor applied to value_from results.
          type: number
        item:
          description: |
            Object (or string) payload: the object to add (add_item, inline
            add_items), the derived-Strike spec (add_strike), the replacement
            movement object (replace_highest_with — required), or the Reach
            trait template for set_reach's baseline form.
        source:
          description: JSONPath selecting items to copy (for add_items).
          type: string
        name:
          description: Item name to remove (remove_item) or add (add_item shorthand).
          type: string
        names:
          description: |
            Ability names an add_items effect places (informational — the
            engine resolves the actual items via `source`).
          type: array
          items:
            type: string
        movement_type:
          description: |
            Movement type to keep (for remove_all_except). replace_highest_with
            reads its movement type from `item` instead.
          type: string
        selection:
          description: Selection descriptor presented to the user (for select).
          type: object
        modifier:
          description: Modifier object to append (for operation=add_modifier)
          type: object

    PatchDocument:
      description: Grouped RFC 6902 patches produced by applying a template
      type: object
      required: [applied_patches, selections]
      properties:
        applied_patches:
          type: array
          items:
            $ref: "#/components/schemas/PatchGroup"
        selections:
          description: Placeholder for future template selections (always empty for Elite/Weak)
          type: array
          items: {}

    PatchGroup:
      type: object
      required: [change_category, description, operations]
      properties:
        change_category:
          type: string
          example: combat_stats
        description:
          type: string
          example: "Increase the creature's AC, attack modifiers, DCs, saving throws, Perception, and skill modifiers by 2."
        operations:
          type: array
          items:
            $ref: "#/components/schemas/PatchOperation"

    PatchOperation:
      description: A single RFC 6902 JSON Patch operation
      type: object
      required: [op, path]
      properties:
        op:
          type: string
          enum: [add, remove, replace]
        path:
          description: "JSON Pointer (RFC 6901) into the creature document"
          type: string
          example: "/stat_block/defense/ac/value"
        value:
          description: New value (present for add/replace)

  responses:
    TemplateApplyResult:
      description: |
        Multipart response with two JSON parts:
        - **patches** — the patch document with grouped RFC 6902 operations
        - **creature** — the full modified creature JSON
      content:
        multipart/mixed:
          schema:
            type: object
            properties:
              patches:
                $ref: "#/components/schemas/PatchDocument"
              creature:
                type: object
          encoding:
            patches:
              contentType: application/json
            creature:
              contentType: application/json
          example:
            description: |
              Part 1 (Content-Disposition: inline; name="patches"):
              {
                "applied_patches": [
                  {
                    "change_category": "level",
                    "description": "Increase the creature's level by 1...",
                    "operations": [
                      {"op": "replace", "path": "/stat_block/creature_type/level", "value": 15}
                    ]
                  }
                ],
                "selections": []
              }

              Part 2 (Content-Disposition: inline; name="creature"):
              { "name": "Adult Red Dragon", "stat_block": { ... } }

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: not found
